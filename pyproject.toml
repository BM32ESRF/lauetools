[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=7.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["LaueTools"]
include-package-data = false  # Disable automatic inclusion of non-Python files

[tool.setuptools_scm]
# Optional: write_to = "src/lauetools/_version.py"  # Only if you need runtime access

[project]
name = "lauetools"
version = "3.2.9"
authors = [
    {name = "J S Micha", email = "micha@esrf.fr"},
]
description = "Distribution of LaueTools Package from github.com/BM32ESRF/Lauetools repository for pip"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8, <3.13"
dependencies = [
    "docutils>=0.3",
    "numpy>=1.0.3",
    "scipy>=0.15.0",
    "matplotlib>=2.0.0",
    "wxpython>=3.0",
    "networkx>=2.1",
    "tqdm>=4.60.0",
    "h5py>=3.1",
    "scikit-image>=0.1.0",
    "astropy>=3.0",
    "fabio>=0.11.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
lauetools = "LaueTools.GUI.mainGUI:start"
peaksearch = "LaueTools.FileSeries.Peak_Search:start"
indexrefine = "LaueTools.FileSeries.Index_Refine:start"
plotmeshGUI = "LaueTools.plotmeshspecGUI:start"
buildsummary = "LaueTools.FileSeries.Build_Summary:start"
plotmap = "LaueTools.FileSeries.Plot_Maps2:start"
mapanalyzer = "LaueTools.FileSeries.mainFileSeriesGUI:start"
daxmgui = "LaueTools.daxmgui:start"
lauetools-copy = "LaueTools.cli:copy_resources"
lauetools-copy-materials = "LaueTools.cli:copy_materials"
lauetools-add-material = "LaueTools.cli_add_material:main"

[project.urls]
Homepage = "https://github.com/BM32ESRF/lauetools"

# Explicitly include only necessary files
[tool.setuptools.package-data]
LaueTools = [
    "scripts/*",  # Include scripts
    "icons/*",     # Include icons (assuming they are small)
    # Include only small example images (e.g., < 1 MB each)
    "LaueImages/small_example_*.tif",
    "LaueImages/small_example_*.dat",
    # Include output-free notebooks (if any)
    "notebooks/*.ipynb",
]

# Exclude all other heavy files
[tool.setuptools.exclude-package-data]
"" = [
    "*.ipynb_checkpoints/*",  # Exclude checkpoint files
    "*.cor",
    "*.fit",
    "*.irp",
    "*.psp",
    "*.out",
    "*.sh",
    "Documentation/*",        # Exclude documentation (host externally)
]
